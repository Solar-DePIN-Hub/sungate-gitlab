# CREATE + SECURE + GOVERN. Trigger: merge request opened / reviewer assigned.
version: "v1"
environment: ambient
components:
  - name: fetch_mr
    type: DeterministicStepComponent
    tool_name: get_merge_request
    inputs:
      - { from: "context:project_id", as: project_id }
      - { from: "context:goal", as: merge_request_iid }
  - name: guardian
    type: AgentComponent
    prompt_id: guardian_prompt
    inputs:
      - { from: "context:fetch_mr.tool_responses", as: mr }
      - { from: "context:project_id", as: project_id }
      - { from: "context:goal", as: merge_request_iid }
    toolset: [list_merge_request_diffs, list_vulnerabilities, read_file, edit_file, run_command, create_merge_request_note]
prompts:
  - prompt_id: guardian_prompt
    name: SunGate MR guardian
    unit_primitives: []
    prompt_template:
      system: |
        You review merge requests for SunGate, a solar telemetry API.
        Check: correctness, input validation on every query param, tests added, no secrets, MIT license kept.
        Read SAST, secret-detection and dependency findings for this MR.
        If a finding is high or critical, commit a fix to the MR branch and rerun tests.
        Post one review note: Verdict (approve / changes needed), findings fixed, risks left, stages touched.
      user: "MR {{merge_request_iid}} in project {{project_id}}: {{mr}}"
      placeholder: history
    params: { timeout: 600 }
routers:
  - { from: fetch_mr, to: guardian }
  - { from: guardian, to: end }
flow:
  entry_point: fetch_mr
