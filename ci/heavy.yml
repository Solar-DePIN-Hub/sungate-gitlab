# Heavy child pipeline (docker build, container scan, ephemeral staging). scripts/carbon-gate.js copies this file;
# in enforce mode, when a greener window is close, it prepends a GitLab "delayed" job so these jobs start at that window.
stages: [build, test, staging]

include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg APP_VERSION="$CI_COMMIT_SHORT_SHA" -t "$CS_IMAGE" .
    - docker push "$CS_IMAGE"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CS_IMAGE" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" && docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi

container_scanning:
  stage: test
  needs: [build-image]
  rules:   # child pipelines have no CI_COMMIT_BRANCH in MR context, so run unconditionally
    - if: $CONTAINER_SCANNING_DISABLED == 'true' || $CONTAINER_SCANNING_DISABLED == '1'
      when: never
    - when: on_success

# Ephemeral staging: boot the exact image we just built and scanned, then smoke-test it.
staging-smoke:
  stage: staging
  needs:
    - job: build-image
    - job: container_scanning
      optional: true
  image: node:24-alpine
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      alias: sungate
  variables:
    APP_URL: http://sungate:8080
    SMOKE_MODE: api
  environment:
    name: staging
    deployment_tier: staging
  script:
    - for i in $(seq 1 30); do wget -qO- http://sungate:8080/healthz && break; sleep 1; done
    - node scripts/smoke.js
  artifacts:
    when: always
    paths: [smoke-report.json]
