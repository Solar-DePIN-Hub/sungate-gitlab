# SunGate pipeline: covers verify, secure, package, release, configure, monitor, govern.
# Duo Agent Platform flows (.gitlab/duo/flows) are triggered by issues, MRs, mentions and pipeline events.
stages: [carbon, verify, secure, package, deploy, monitor, release]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  NODE_IMAGE: node:20-alpine
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  image: $NODE_IMAGE

carbon-gate:
  stage: carbon
  script:
    - node scripts/sci.js --gate
  artifacts: { paths: [sci-report.json], expire_in: 30 days }
  allow_failure: { exit_codes: 3 }   # exit 3 = "defer": Duo pipeline flow reschedules heavy jobs

lint:
  stage: verify
  script: [node scripts/lint.js]

test:
  stage: verify
  script: [node --test --test-reporter=junit --test-reporter-destination=junit.xml test/]
  artifacts: { reports: { junit: junit.xml }, when: always }

governance-check:
  stage: verify
  script:
    - test -f LICENSE && grep -q "MIT License" LICENSE
    - test -f .gitlab/CODEOWNERS
    - test -f .gitlab/duo/agent-config.yml
    - echo "governance ok"

build-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CS_IMAGE" .
    - docker push "$CS_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

container_scanning:
  stage: secure
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  stage: deploy
  image: google/cloud-sdk:slim
  environment: { name: staging, url: $STAGING_URL }
  script: [sh deploy/cloudrun.sh sungate-staging]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT

smoke-staging:
  stage: monitor
  needs: [deploy-staging]
  variables: { APP_URL: $STAGING_URL }
  script: [node scripts/smoke.js]
  artifacts: { paths: [smoke-report.json], when: always }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT

deploy-production:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: [smoke-staging]
  environment: { name: production, url: $PROD_URL }
  script: [sh deploy/cloudrun.sh sungate]
  when: manual          # Supervised autonomy: human approves the outcome
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT

monitor-production:
  stage: monitor
  variables: { APP_URL: $PROD_URL }
  script: [node scripts/smoke.js]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # scheduled every 30 min; failure triggers incident flow

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script: [echo "Releasing $CI_COMMIT_TAG"]
  release:
    tag_name: $CI_COMMIT_TAG
    description: CHANGELOG.md
  rules:
    - if: $CI_COMMIT_TAG
