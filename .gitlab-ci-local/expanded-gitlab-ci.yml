stages:
  - .pre
  - green-wait
  - build
  - test
  - staging
  - .post
variables:
  CS_ANALYZER_IMAGE: $CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning:8
  CS_SCHEMA_MODEL: '15'
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
container_scanning:
  image:
    name: $CS_ANALYZER_IMAGE$CS_IMAGE_SUFFIX
  stage: test
  variables:
    GIT_STRATEGY: none
  allow_failure: true
  artifacts:
    access: developer
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: '**/gl-sbom-*.cdx.json'
    paths:
      - gl-container-scanning-report.json
      - gl-dependency-scanning-report.json
      - '**/gl-sbom-*.cdx.json'
  dependencies: []
  script:
    - gtcs scan
  rules:
    - if: >-
        $CONTAINER_SCANNING_DISABLED == 'true' || $CONTAINER_SCANNING_DISABLED
        == '1'
      when: never
    - when: on_success
  needs:
    - job: build-image
      artifacts: true
      optional: false
include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml
build-image:
  stage: build
  image:
    name: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - >-
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER"
      --password-stdin "$CI_REGISTRY"
    - >-
      docker build --build-arg APP_VERSION="$CI_COMMIT_SHORT_SHA" -t "$CS_IMAGE"
      .
    - docker push "$CS_IMAGE"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CS_IMAGE" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" && docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
staging-smoke:
  stage: staging
  needs:
    - job: build-image
      artifacts: true
      optional: false
    - job: container_scanning
      artifacts: true
      optional: true
  image:
    name: node:24-alpine
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      alias: sungate
  variables:
    APP_URL: http://sungate:8080
    SMOKE_MODE: api
  environment:
    name: staging
    deployment_tier: staging
  script:
    - >-
      for i in $(seq 1 30); do wget -qO- http://sungate:8080/healthz && break;
      sleep 1; done
    - node scripts/smoke.js
  artifacts:
    when: always
    paths:
      - smoke-report.json
green-window-wait:
  stage: green-wait
  image:
    name: node:24-alpine
  when: delayed
  start_in: 792 minutes
  script:
    - >-
      echo "Heavy jobs time-shifted - grid 56.1% cleaner in 792 min (43 vs 98
      gCO2e/kWh)"
    - echo "Green window starts 2026-10-23T21:30:00.000Z (43 gCO2e/kWh)"
default: {}
